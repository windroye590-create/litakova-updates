name: Випустити EXE та Apps Script

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Нова версія X.Y.Z (наприклад 1.2.28)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: python3 -m pip install Pillow==12.3.0 cryptography==50.0.2
      - name: Check signing and Google credential configuration
        env:
          GAS_CREDENTIALS: ${{ secrets.GAS_CREDENTIALS }}
          LK_SIGNING_PKCS12_BASE64: ${{ secrets.LK_SIGNING_PKCS12_BASE64 }}
          LK_SIGNING_PASSWORD: ${{ secrets.LK_SIGNING_PASSWORD }}
        run: python3 release-tools/release_pipeline.py check-secrets
      - name: Prepare consistent application versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 release-tools/release_pipeline.py prepare --version "$RELEASE_VERSION"
      - name: Inspect current Apps Script and preserve its deployment
        env:
          GAS_CREDENTIALS: ${{ secrets.GAS_CREDENTIALS }}
        run: python3 release-tools/appscript_deploy.py plan --receipt "$RUNNER_TEMP/server-plan.json"
      - name: Test release tools and all application model regressions
        run: |
          python3 -m unittest discover -s release-tools/tests -p 'test_*.py'
          npm --prefix source test
      - name: Build and verify the actual Windows image
        working-directory: source
        run: |
          python3 build_windows.py
          python3 tests/validate_pe.py
          python3 tests/packed_image.py build/Litakova-Komisiia-PC.exe --root . --check
      - name: Verify browser UI and startup using the built EXE
        working-directory: source
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium
          node tests/results-ui.mjs
          node tests/written-ui.mjs
          node tests/review-presence-ui.mjs
          node tests/responsive-ui.mjs
          node tests/ui.mjs
          node tests/packaged-startup.mjs
      - name: Sign the four public update files
        env:
          LK_SIGNING_PKCS12_BASE64: ${{ secrets.LK_SIGNING_PKCS12_BASE64 }}
          LK_SIGNING_PASSWORD: ${{ secrets.LK_SIGNING_PASSWORD }}
        run: |
          python3 release-tools/release_pipeline.py sign --bundle "$RUNNER_TEMP/public-bundle"
          python3 source/tests/update_protocol.py "$RUNNER_TEMP/public-bundle"
      - name: Reject a stale release before any server writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release-tools/release_pipeline.py check-newer --bundle "$RUNNER_TEMP/public-bundle"
      - name: Record tested sources and candidate files
        id: snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release-tools/release_pipeline.py snapshot --bundle "$RUNNER_TEMP/public-bundle" --receipt "$RUNNER_TEMP/server-plan.json"
      - name: Update Apps Script if required and verify its public health
        env:
          GAS_CREDENTIALS: ${{ secrets.GAS_CREDENTIALS }}
        run: python3 release-tools/appscript_deploy.py apply --receipt "$RUNNER_TEMP/server-plan.json"
      - name: Publish verified update after server success
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.snapshot.outputs.commit }}
        run: python3 release-tools/github_release.py "$RUNNER_TEMP/public-bundle" --commit "$RELEASE_COMMIT"
      - name: Save public verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-verification
          path: |
            source/verification/*.json
            ${{ runner.temp }}/server-plan.json
          if-no-files-found: warn
