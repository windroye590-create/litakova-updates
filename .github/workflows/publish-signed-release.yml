name: Publish signed Windows release

on:
  push:
    branches: [main]
    paths:
      - 'channel/**'
      - 'release-tools/github_release.py'
      - 'release-tools/update-public.pem'
      - 'release-notes.md'
      - '.github/workflows/publish-signed-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-windows-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify signed bundle
        run: python3 release-tools/github_release.py channel --verify-only
      - name: Verify publication safeguards
        run: python3 -m unittest discover -s release-tools/tests -p 'test_*.py'
      - name: Upload, verify, then publish latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release-tools/github_release.py channel
