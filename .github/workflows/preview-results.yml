name: Перегляд об’єднаних результатів

on:
  push:
    branches: ['preview/results-workspace']
    paths: ['source/**', 'release-tools/**', 'docs/RESULTS-PREVIEW-UA.md', '.github/workflows/preview-results.yml']

permissions:
  contents: write

concurrency:
  group: signed-windows-release
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==12.3.0 cryptography==50.0.2 openpyxl==3.1.5
      - name: Test results, grading, release safeguards and existing application logic
        run: |
          python3 -m unittest discover -s release-tools/tests -p 'test_*.py'
          npm --prefix source test
      - name: Verify all tabs, real written grading and instructor review locks
        working-directory: source
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps chromium
          node tests/results-ui.mjs
          node tests/written-ui.mjs
          node tests/review-presence-ui.mjs
          node tests/responsive-ui.mjs
          node tests/ui.mjs
      - name: Build and verify the preview EXE
        working-directory: source
        run: |
          python3 build_windows.py
          python3 tests/validate_pe.py
          python3 tests/packed_image.py build/Litakova-Komisiia-PC.exe --root . --check
          node tests/packaged-startup.mjs
      - name: Sign the preview with the original update key
        env:
          LK_SIGNING_PKCS12_BASE64: ${{ secrets.LK_SIGNING_PKCS12_BASE64 }}
          LK_SIGNING_PASSWORD: ${{ secrets.LK_SIGNING_PASSWORD }}
        run: |
          python3 release-tools/release_pipeline.py sign --bundle "$RUNNER_TEMP/preview-bundle"
          python3 source/tests/update_protocol.py "$RUNNER_TEMP/preview-bundle"
      - name: Publish an immutable prerelease for manual review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release-tools/publish_preview.py "$RUNNER_TEMP/preview-bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: results-workspace-verification
          path: |
            source/verification/*.json
            source/verification/results-*.png
          if-no-files-found: warn
