name: Verify reliability fixes 1.2.26
on:
  push:
    branches: ['repair/reliability-1.2.26']
    paths:
      - 'release-staging/v1.2.26/**'
      - '.github/workflows/verify-reliability-1.2.26.yml'
permissions:
  contents: read
concurrency:
  group: verify-reliability-1.2.26
  cancel-in-progress: false
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify supplied image and unpack matching sources
        run: python3 release-staging/v1.2.26/verify_candidate.py "$RUNNER_TEMP/source"
      - name: Independently build the Windows image
        working-directory: ${{ runner.temp }}/source
        run: |
          python3 -m pip install Pillow==12.3.0 cryptography==50.0.2
          python3 build_windows.py
          python3 tests/validate_pe.py
          python3 tests/packed_image.py build/Litakova-Komisiia-PC.exe --root . --check
      - name: Check supplied image assets and native regressions
        working-directory: ${{ runner.temp }}/source
        run: |
          python3 tests/packed_image.py "$GITHUB_WORKSPACE/release-staging/v1.2.26/Litakova-Komisiia-PC.exe" --root . --check
          python3 tests/storage_json.py
          python3 tests/storage_files.py
          python3 tests/native_clock.py
          python3 tests/update_native.py
          python3 tests/update_channel.py
          python3 tests/update_protocol.py
          node tests/fix-frontend-reliability.mjs
          node tests/fix-server-reliability.mjs
          node tests/fix-server-exams.mjs
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify candidate and unpack sources
        run: python release-staging/v1.2.26/verify_candidate.py "${{ runner.temp }}/source"
      - name: Exercise actual Windows host, encrypted storage and DPAPI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force verification | Out-Null
          python "${{ runner.temp }}/source/tests/windows-private-storage.py" release-staging/v1.2.26/Litakova-Komisiia-PC.exe verification/windows-private-storage-1.2.26.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-storage-1.2.26
          path: verification/windows-private-storage-1.2.26.json
          if-no-files-found: warn
