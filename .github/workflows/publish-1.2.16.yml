name: Publish Windows 1.2.16
on:
  push:
    branches: [main]
    paths: ['release-staging/v1.2.16/**', '.github/workflows/publish-1.2.16.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-windows-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore and verify signed release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess, shutil, os
          stage=Path('release-staging/v1.2.16')
          exe=Path('channel/Litakova-Komisiia-PC.exe')
          expected='e72d45e443fd757e823fcced5b81011aab6a622cb03efad2e48681a724414ed9'
          actual=hashlib.sha256(exe.read_bytes()).hexdigest()
          if actual!=expected:
              assert actual=='adaf992ca21a3eaefcb650217f000f1276d178a71ace5fa682a38ec8efeea4bd', 'Unexpected base EXE'
              shutil.copyfile(exe,Path(os.environ['RUNNER_TEMP'])/'lk-startup-base.exe')
              subprocess.run(['git','apply','--check',str(stage/'windows.patch')],check=True)
              subprocess.run(['git','apply',str(stage/'windows.patch')],check=True)
          assert hashlib.sha256(exe.read_bytes()).hexdigest()==expected
          for name in ['updates.txt','index.html']:
              shutil.copyfile(stage/name,Path('channel')/name)
          shutil.copyfile(stage/'release-notes.md','release-notes.md')
          PY
          python3 release-tools/github_release.py channel --verify-only
          python3 -m unittest discover -s release-tools/tests -p 'test_*.py'
      - name: Check actual packaged startup in Chromium
        timeout-minutes: 5
        run: |
          python3 - <<'PY_CI'
          from pathlib import Path
          import base64, json, os, shutil, subprocess, zipfile, io
          stage=Path('release-staging/v1.2.16')
          ci=Path(os.environ['RUNNER_TEMP'])/'lk-packaged-startup'
          ci.mkdir()
          with zipfile.ZipFile(io.BytesIO(base64.b64decode((stage/'packaged-tests.zip.b64').read_text(),validate=False))) as z:
              assert all(not Path(n).is_absolute() and '..' not in Path(n).parts for n in z.namelist())
              z.extractall(ci)
          exe=Path('channel/Litakova-Komisiia-PC.exe').resolve()
          subprocess.run(['python3',str(ci/'tests/packed_image.py'),str(exe),'--root',str(ci),'--metadata',str(ci/'assets-1.2.16.json'),'--output',str(ci/'web'),'--check'],check=True)
          (ci/'web/manifest.json').unlink()
          (ci/'verification').mkdir()
          subprocess.run(['npm','install','--prefix',str(ci),'--ignore-scripts','--no-audit','--no-fund'],check=True)
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          assert chrome, 'A real Chromium executable is required for release'
          env=os.environ.copy()
          env.update(CHROMIUM_PATH=chrome,PACKED_EXE=str(exe),PACKED_METADATA=str(ci/'assets-1.2.16.json'))
          old=Path(os.environ['RUNNER_TEMP'])/'lk-startup-base.exe'
          if old.exists():
              env.update(BROKEN_EXE=str(old),BROKEN_SOURCE=str(ci),BROKEN_METADATA=str(ci/'assets-1.2.15.json'))
          subprocess.run(['node',str(ci/'tests/packaged-startup.mjs')],check=True,env=env)
          print((ci/'verification/packaged-startup.json').read_text())
          PY_CI
      - name: Store verified release in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel/Litakova-Komisiia-PC.exe channel/updates.txt channel/index.html release-notes.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Windows 1.2.16 / 139'
            git push origin HEAD:main
          fi
      - name: Upload verify and publish latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release-tools/github_release.py channel

