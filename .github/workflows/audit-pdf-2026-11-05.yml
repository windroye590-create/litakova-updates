name: Verify PDF repaint completion
on:
  push:
    branches: [audit/2026-11-04]
    paths: ['audit/pdf-repaint-2026-11-05/**', '.github/workflows/audit-pdf-2026-11-05.yml']
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact audited candidate
        run: python3 audit/2026-11-04/restore.py
      - name: Install isolated test dependency
        run: npm install --prefix "$RUNNER_TEMP/litakova-full-audit" --ignore-scripts --no-audit --no-fund
      - name: Repeat complete PDF materials scenarios three times with paint synchronization
        run: |
          cp audit/pdf-repaint-2026-11-05/materials-ui.mjs "$RUNNER_TEMP/litakova-full-audit/tests/materials-ui.mjs"
          export LITAKOVA_CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          cd "$RUNNER_TEMP/litakova-full-audit"
          for attempt in 1 2 3; do
            echo "PDF_ATTEMPT $attempt"
            node tests/materials-ui.mjs
          done
