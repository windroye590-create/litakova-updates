name: Publish Windows 1.2.18
on:
  push:
    branches: [main]
    paths: ['release-staging/v1.2.18/**', '.github/workflows/publish-1.2.18.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-windows-release
  cancel-in-progress: false
jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore and verify exact signed bundle
        run: |
          python3 release-staging/v1.2.18/restore_bundle.py
          python3 release-tools/github_release.py channel --verify-only
          python3 -m unittest discover -s release-tools/tests -p 'test_*.py'
      - name: Exercise packaged startup, account isolation, offline recovery and migration
        run: python3 release-staging/v1.2.18/verify-browser.py
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact signed image
        shell: bash
        run: python release-staging/v1.2.18/restore_bundle.py
      - name: Check actual Windows CNG, DPAPI, backups and account boundaries
        shell: bash
        run: python release-staging/v1.2.18/tests/windows-private-storage.py channel/Litakova-Komisiia-PC.exe
  publish:
    needs: [verify-browser, verify-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore verified bundle
        run: |
          python3 release-staging/v1.2.18/restore_bundle.py
          python3 release-tools/github_release.py channel --verify-only
      - name: Require the compatible active API 22 backend
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url='https://script.google.com/macros/s/AKfycbxthXT1noK9KVJGiqgLOu8L5HgUI8olKC4cySBYM8Yaj4Um8Usm0OgqzZeC1pt5csh7VQ/exec'
          with urllib.request.urlopen(url,timeout=45) as response:health=json.load(response)
          assert health.get('ok') is True and health.get('version',0)>=22 and health.get('privateLocalStorage') is True,'Activate and verify API 22 before publishing Windows 1.2.18'
          print(json.dumps({'version':health['version'],'serverBuild':health.get('serverBuild'),'privateLocalStorage':health['privateLocalStorage']}))
          PY
      - name: Store verified release in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel/Litakova-Komisiia-PC.exe channel/updates.txt channel/index.html release-notes.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Windows 1.2.18 / 141'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload, verify and publish latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release-tools/github_release.py channel
