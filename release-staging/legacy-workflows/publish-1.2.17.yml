name: Publish Windows 1.2.17
on:
  push:
    branches: [main]
    paths: ['release-staging/v1.2.17/**', '.github/workflows/publish-1.2.17.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-windows-release
  cancel-in-progress: false
jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore and verify exact signed bundle
        run: |
          python3 release-staging/v1.2.17/restore_bundle.py
          python3 release-tools/github_release.py channel --verify-only
          python3 -m unittest discover -s release-tools/tests -p 'test_*.py'
      - name: Check packaged resources and recovery in Chromium
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,shutil,subprocess
          stage=Path('release-staging/v1.2.17')
          ci=Path(os.environ['RUNNER_TEMP'])/'lk-recovery-browser'
          (ci/'tests').mkdir(parents=True)
          (ci/'verification').mkdir()
          for name in ['packed_image.py','packaged-startup.mjs']:
              shutil.copyfile(stage/name,ci/'tests'/name)
          metadata=(stage/'assets-1.2.17.json').resolve()
          (ci/'package.json').write_text(json.dumps({'name':'litakova-packaged-recovery','private':True,'type':'module','version':'1.2.17','versionCode':140,'dependencies':{'playwright':'1.62.1'}}))
          exe=Path('channel/Litakova-Komisiia-PC.exe').resolve()
          subprocess.run(['python3',str(ci/'tests/packed_image.py'),str(exe),'--root',str(ci),'--metadata',str(metadata),'--output',str(ci/'web'),'--check'],check=True)
          (ci/'web/manifest.json').unlink()
          subprocess.run(['npm','install','--prefix',str(ci),'--ignore-scripts','--no-audit','--no-fund'],check=True)
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          assert chrome,'A real Chromium executable is required'
          env=os.environ.copy()
          env.update(CHROMIUM_PATH=chrome,PACKED_EXE=str(exe),PACKED_METADATA=str(metadata))
          subprocess.run(['node',str(ci/'tests/packaged-startup.mjs')],check=True,env=env)
          print((ci/'verification/packaged-startup.json').read_text())
          PY
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact Windows image
        shell: bash
        run: python release-staging/v1.2.17/restore_bundle.py
      - name: Check real Windows host storage and DPAPI
        shell: bash
        run: python release-staging/v1.2.17/windows-storage.py channel/Litakova-Komisiia-PC.exe
  publish:
    needs: [verify-browser, verify-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore verified bundle
        run: |
          python3 release-staging/v1.2.17/restore_bundle.py
          python3 release-tools/github_release.py channel --verify-only
      - name: Require the compatible active backend
        run: |
          python3 - <<'PYHEALTH'
          import json,urllib.request
          url='https://script.google.com/macros/s/AKfycbxthXT1noK9KVJGiqgLOu8L5HgUI8olKC4cySBYM8Yaj4Um8Usm0OgqzZeC1pt5csh7VQ/exec'
          with urllib.request.urlopen(url,timeout=45) as response:health=json.load(response)
          assert health.get('ok') is True and health.get('version',0)>=21 and health.get('trainingResume') is True,'Activate and verify API 21 before publishing Windows 1.2.17'
          print(json.dumps({'version':health['version'],'serverBuild':health.get('serverBuild'),'trainingResume':health['trainingResume']}))
          PYHEALTH
      - name: Store verified release in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel/Litakova-Komisiia-PC.exe channel/updates.txt channel/index.html release-notes.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Windows 1.2.17 / 140'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload verify and publish latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release-tools/github_release.py channel
