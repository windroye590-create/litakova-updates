name: Verify published updater 1.2.25 to 1.2.26
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-published-1.2.26.yml'
      - 'release-staging/v1.2.26/verify_installed_updater.py'
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check signature and download through the previous Windows host
        run: python release-staging/v1.2.26/verify_installed_updater.py verification/published-updater-1.2.26.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: published-updater-1.2.26
          path: verification/published-updater-1.2.26.json
          if-no-files-found: warn
